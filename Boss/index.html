
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Surprise for Boss 💗</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Trebuchet MS', sans-serif;
    background: linear-gradient(135deg, #ffe0ed, #f9c5dc, #fff0f5);
}

.card {
    width: 90%;
    max-width: 420px;
    min-height: 430px;
    background: rgba(255,255,255,0.85);
    border-radius: 30px;
    padding: 40px 25px;
    text-align: center;
    box-shadow: 0 15px 45px rgba(180, 70, 120, 0.18);
    position: relative;
    z-index: 2;
}

.emoji {
    font-size: 65px;
    margin-bottom: 20px;
}

h1 {
    color: #d94f89;
    font-size: 29px;
    margin-bottom: 15px;
}

p {
    color: #a85d7c;
    font-size: 17px;
    line-height: 1.6;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 35px;
    min-height: 55px;
}

button {
    border: none;
    padding: 14px 30px;
    border-radius: 30px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

#yes {
    background: #ee76a8;
    color: white;
    box-shadow: 0 5px 15px #f5bad2;
}

#yes:hover {
    transform: scale(1.1);
}

#no {
    background: #eeeeee;
    color: #777;
    position: relative;
}

.hidden {
    display: none;
}

#message {
    animation: appear 0.8s ease;
}

#message h1 {
    margin-top: 15px;
}

#message p {
    margin-top: 15px;
}

.heart {
    position: fixed;
    bottom: -30px;
    font-size: 22px;
    animation: float 6s linear infinite;
    pointer-events: none;
    z-index: 1;
}

@keyframes float {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(0.7);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}
</style>
</head>

<body>

<div class="card" id="mainCard">

    <div id="question">
        <div class="emoji">🥺💗</div>

        <h1>Hey Boss!</h1>

        <p>
            I have a very important question
            to ask you...
            <br><br>
            Do you love me? 🥹
        </p>

        <div class="buttons">
            <button id="yes" onclick="sayYes()">YES 💗</button>
            <button id="no">NO 🙃</button>
        </div>
    </div>

    <div id="message" class="hidden">
        <div class="emoji">🥰💞</div>

        <h1>Hehe! I knew it!</h1>

        <p>
            You don't have any other option anyway! 😂
            <br><br>
            But seriously, you mean so much to me.
            Thank you for being a special part of my life.
            <br><br>
            Sending you unlimited hugs and kisses! 💋
            <br><br>
            Love youuu, Boss! 💗
        </p>

        <div class="emoji">🧸💕</div>
    </div>

</div>

<script>

const noButton = document.getElementById("no");

function moveButton() {
    const maxX = window.innerWidth - noButton.offsetWidth - 20;
    const maxY = window.innerHeight - noButton.offsetHeight - 20;

    noButton.style.position = "fixed";
    noButton.style.left = Math.max(10, Math.random() * maxX) + "px";
    noButton.style.top = Math.max(10, Math.random() * maxY) + "px";
}

noButton.addEventListener("mouseover", moveButton);
noButton.addEventListener("touchstart", function(e) {
    e.preventDefault();
    moveButton();
});

noButton.addEventListener("click", moveButton);

function sayYes() {
    document.getElementById("question").classList.add("hidden");
    document.getElementById("message").classList.remove("hidden");
    createHearts();
}

function createHearts() {
    const symbols = ["💗", "💕", "💖", "💘", "🌸"];

    for (let i = 0; i < 35; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (3 + Math.random() * 5) + "s";
        heart.style.animationDelay = Math.random() * 3 + "s";

        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 9000);
    }
}

// Floating hearts in the background
setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💗";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = "6s";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 6000);
}, 700);

</script>

</body>
</html>
